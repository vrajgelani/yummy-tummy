<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | Yummy Tummy</title>

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/header.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/profile.css"
    >

</head>


<body>


    <!-- =================================
         HEADER
    ================================= -->

    <header class="site-header">

        <div class="container header-container">

            <a
                href="index.html"
                class="site-logo"
            >
                Yummy Tummy
            </a>


            <nav class="main-navigation">

                <a href="index.html">
                    Home
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="restaurants.html">
                    Restaurants
                </a>

                <a
                    href="wishlist.html"
                    class="header-wishlist"
                >
                    Wishlist
                </a>

                <a
                    href="cart.html"
                    class="header-cart"
                >
                    Cart
                </a>

                <a
                    href="profile.html"
                    class="header-login"
                >
                    Profile
                </a>

            </nav>

        </div>

    </header>



    <!-- =================================
         PROFILE MAIN
    ================================= -->

    <main class="profile-main">


        <section class="profile-section">

            <div class="container">


                <!-- PROFILE HEADING -->

                <div class="profile-heading">

                    <p class="profile-label">
                        MY ACCOUNT
                    </p>

                    <h1 class="profile-title">
                        My Profile
                    </h1>

                    <p class="profile-description">
                        Manage your Yummy Tummy account
                        and personal information.
                    </p>

                </div>



                <!-- PROFILE CARD -->

                <div class="profile-card">


                    <!-- PROFILE INFORMATION -->

                    <div class="profile-information">

                        <div class="profile-avatar">
                            <span id="profileInitial">
                                U
                            </span>
                        </div>


                        <div class="profile-user-content">

                            <h2
                                id="profileName"
                                class="profile-name"
                            >
                                User
                            </h2>

                            <p
                                id="profileEmail"
                                class="profile-email"
                            >
                                -
                            </p>

                        </div>

                    </div>



                    <!-- ACCOUNT DETAILS -->

                    <div class="profile-details">


                        <div class="profile-detail-item">

                            <span class="profile-detail-label">
                                Name
                            </span>

                            <strong
                                id="profileDetailName"
                                class="profile-detail-value"
                            >
                                -
                            </strong>

                        </div>


                        <div class="profile-detail-item">

                            <span class="profile-detail-label">
                                Email
                            </span>

                            <strong
                                id="profileDetailEmail"
                                class="profile-detail-value"
                            >
                                -
                            </strong>

                        </div>


                    </div>



                    <!-- PROFILE ACTIONS -->

                    <div class="profile-actions">

                        <a
                            href="orders.html"
                            class="profile-action-button profile-orders-button"
                        >
                            My Orders
                        </a>


                        <a
                            href="wishlist.html"
                            class="profile-action-button profile-wishlist-button"
                        >
                            Wishlist
                        </a>


                        <button
                            type="button"
                            id="logoutButton"
                            class="profile-action-button profile-logout-button"
                        >
                            Logout
                        </button>

                    </div>


                </div>

            </div>

        </section>


    </main>



    <!-- =================================
         FOOTER
    ================================= -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Yummy Tummy. All rights reserved.
            </p>

        </div>

    </footer>



    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script src="js/auth.js"></script>

    <script src="js/profile.js"></script>


</body>

</html>
