<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yummy Tummy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="header-container">

            <a class="brand-logo" href="index.html" aria-label="Yummy Tummy Home">
                <img
                    src="images/logo/yummy-tummy-logo.png"
                    alt="Yummy Tummy"
                >
            </a>

            <nav class="main-navigation" aria-label="Main Navigation">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="menu.html" class="nav-link">Menu</a>
                <a href="restaurants.html" class="nav-link">Restaurants</a>
            </nav>

            <div class="header-search">
                <label for="header-search-input" class="search-label">
                    Search
                </label>

                <input
                    type="search"
                    id="header-search-input"
                    name="header-search"
                    placeholder="Search food or restaurant"
                    autocomplete="off"
                >
            </div>

            <div class="header-actions">

                <a href="wishlist.html" class="header-action">
                    Wishlist
                </a>

                <a href="cart.html" class="header-action">
                    Cart
                </a>

                <div class="guest-actions">
                    <a href="login.html" class="header-action login-button">
                        Login
                    </a>

                    <a href="register.html" class="header-action register-button">
                        Register
                    </a>
                </div>

                <a href="profile.html" class="header-action profile-button">
                    Profile
                </a>

            </div>

        </div>
    </header>

    <main class="page-content">
        <section class="welcome-section">
            <div class="container">
                <p class="brand-label">YUMMY TUMMY</p>

                <h1>Delicious Food, Happy Moments</h1>

                <p class="welcome-text">
                    Your delicious food journey starts here.
                </p>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
